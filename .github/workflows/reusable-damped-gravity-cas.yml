name: Reusable Damped Gravity Incremental CAS Build (v11)

on:
  workflow_call:
    inputs:
      kind: { description: 'Build kind: rust-lib-and-bin | zig-c-lib', required: true, type: string }
      crate_bin: { description: 'Cargo binary target name (e.g. pnpm, cargo, uv)', required: false, type: string, default: '' }
      crate_lib: { description: 'Cargo cdylib package name (e.g. libpnpm-ffi, libcargo-ffi, libuvpy-ffi)', required: false, type: string, default: '' }
      asset_prefix: { description: 'Release asset prefix (e.g. pnpm, cargo, uv, libuv)', required: true, type: string }
      publish_release: { description: 'Publish GitHub Release on tag push', required: false, type: boolean, default: true }

permissions:
  contents: write

jobs:
  fast-lib:
    if: inputs.crate_lib != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, os_tag: windows-x64, ext: dll }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, os_tag: linux-x64, ext: so }
          - { os: macos-latest, target: aarch64-apple-darwin, os_tag: macos-arm64, ext: dylib }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with: { repository: awesome-os/maintenance-workflows, ref: v1, path: .holo-ci-runtime }
      - uses: actions/setup-node@v7
        with: { node-version: '26' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - id: rust_cache
        uses: Swatinem/rust-cache@v2
        with:
          key: damped-gravity-lib-${{ inputs.crate_lib }}-${{ matrix.target }}
          shared-key: damped-gravity-v11-${{ matrix.target }}
      - name: Build, stage & emit telemetry (${{ inputs.crate_lib }})
        shell: bash
        env:
          GRAVITY_KIND: ${{ inputs.kind }}
          GRAVITY_CRATE: ${{ inputs.crate_lib }}
          GRAVITY_ASSET_PREFIX: ${{ inputs.asset_prefix }}
          GRAVITY_OS: ${{ matrix.os }}
          GRAVITY_OS_TAG: ${{ matrix.os_tag }}
          GRAVITY_TARGET: ${{ matrix.target }}
          GRAVITY_EXT: ${{ matrix.ext }}
          GRAVITY_CACHE_HIT: ${{ steps.rust_cache.outputs.cache-hit || 'false' }}
        run: node .holo-ci-runtime/holo-ci/gravity-bump-helper.mts build fast-lib
      - uses: actions/upload-artifact@v7
        with: { name: 'lib-${{ inputs.asset_prefix }}-${{ matrix.os_tag }}', path: 'dist/*', retention-days: 7 }

  incremental-bin:
    if: inputs.crate_bin != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, os_tag: windows-x64, ext: .exe }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, os_tag: linux-x64, ext: '' }
          - { os: macos-latest, target: aarch64-apple-darwin, os_tag: macos-arm64, ext: '' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with: { repository: awesome-os/maintenance-workflows, ref: v1, path: .holo-ci-runtime }
      - uses: actions/setup-node@v7
        with: { node-version: '26' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - id: rust_cache
        uses: Swatinem/rust-cache@v2
        with:
          key: damped-gravity-bin-${{ inputs.crate_bin }}-${{ matrix.target }}
          shared-key: damped-gravity-v11-${{ matrix.target }}
      - name: Build, stage & emit telemetry (${{ inputs.crate_bin }})
        shell: bash
        env:
          GRAVITY_KIND: ${{ inputs.kind }}
          GRAVITY_CRATE: ${{ inputs.crate_bin }}
          GRAVITY_ASSET_PREFIX: ${{ inputs.asset_prefix }}
          GRAVITY_OS: ${{ matrix.os }}
          GRAVITY_OS_TAG: ${{ matrix.os_tag }}
          GRAVITY_TARGET: ${{ matrix.target }}
          GRAVITY_EXT: ${{ matrix.ext }}
          GRAVITY_CACHE_HIT: ${{ steps.rust_cache.outputs.cache-hit || 'false' }}
        run: node .holo-ci-runtime/holo-ci/gravity-bump-helper.mts build incremental-bin
      - uses: actions/upload-artifact@v7
        with: { name: 'bin-${{ inputs.asset_prefix }}-${{ matrix.os_tag }}', path: 'dist/*', retention-days: 7 }

  publish:
    if: inputs.publish_release && startsWith(github.ref, 'refs/tags/v')
    needs: [fast-lib, incremental-bin]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { repository: awesome-os/maintenance-workflows, ref: v1, path: .holo-ci-runtime }
      - uses: actions/setup-node@v7
        with: { node-version: '26' }
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Generate SHA256SUMS + SHA512SUMS & Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          GRAVITY_ASSET_PREFIX: ${{ inputs.asset_prefix }}
        run: node .holo-ci-runtime/holo-ci/gravity-bump-helper.mts publish
