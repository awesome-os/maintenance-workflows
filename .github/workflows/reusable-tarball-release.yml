name: Reusable Tarball Release (tar.zst + SHA256SUMS)

on:
  workflow_call:
    inputs:
      archive_prefix:
        description: 'Archive prefix (e.g. t2desktop-noctalia)'
        required: true
        type: string
      test_command:
        description: 'Optional test command to run before packaging'
        required: false
        default: ''
        type: string
      tag:
        description: 'Optional tag override'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release-tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run tests
        if: ${{ inputs.test_command != '' }}
        run: ${{ inputs.test_command }}

      - name: Package tar.zst & Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            case "$GITHUB_REF" in
              refs/tags/*) TAG="${GITHUB_REF#refs/tags/}" ;;
              *) TAG="v0.1.0" ;;
            esac
          fi
          OUT="${{ inputs.archive_prefix }}-${TAG}.tar.zst"
          tar --zstd --exclude='.git' --exclude='node_modules' -cf "../${OUT}" .
          mv "../${OUT}" "./${OUT}"
          sha256sum "$OUT" > SHA256SUMS.txt
          sha512sum "$OUT" > SHA512SUMS.txt
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT" SHA256SUMS.txt SHA512SUMS.txt --clobber -R "${{ github.repository }}"
          else
            gh release create "$TAG" "$OUT" SHA256SUMS.txt SHA512SUMS.txt -R "${{ github.repository }}" \
              --title "${{ inputs.archive_prefix }} ${TAG}" \
              --notes "Automated SHA-256 & SHA-512 (v11 CAS) verified release via awesome-os/maintenance-workflows."
          fi
