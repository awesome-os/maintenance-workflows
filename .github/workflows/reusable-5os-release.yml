name: Reusable 5-OS Native Release (Zig C11 + SHA256SUMS + Installers)

on:
  workflow_call:
    inputs:
      binary_name:
        description: 'Base output binary name (e.g. godot, obs, sectium-browser)'
        required: true
        type: string
      c_source:
        description: 'Path to C11 launcher/entry source file'
        required: true
        type: string
      win_ldflags:
        description: 'Extra Windows link flags (e.g. -mwindows -lgdi32 -luser32)'
        required: false
        default: ''
        type: string
      build_wasm:
        description: 'Also build wasm32-wasi target'
        required: false
        default: true
        type: boolean
      tag:
        description: 'Release tag override (defaults to ref tag)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release-5os:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.14.1'

      - name: Cross-compile 5-target matrix
        run: |
          mkdir -p dist
          BIN="${{ inputs.binary_name }}"
          SRC="${{ inputs.c_source }}"

          zig cc -target x86_64-windows-gnu -O2 "$SRC" ${{ inputs.win_ldflags }} -o "dist/${BIN}.exe"
          zig cc -target x86_64-linux-musl -O2 "$SRC" -o "dist/${BIN}-linux-x64"
          zig cc -target aarch64-linux-musl -O2 "$SRC" -o "dist/${BIN}-linux-arm64"
          zig cc -target aarch64-macos -O2 "$SRC" -o "dist/${BIN}-macos-arm64"

          if [ "${{ inputs.build_wasm }}" = "true" ]; then
            zig cc -target wasm32-wasi -O2 "$SRC" -o "dist/${BIN}.wasm" || echo "::warning::wasm32-wasi skipped for ${BIN}"
          fi

          # Generate universal install.ps1 and install.sh
          cat > dist/install.ps1 <<EOF
          \$ErrorActionPreference = 'Stop'
          \$dir = "\$env:LOCALAPPDATA\\AwesomeOS\\${BIN}"
          New-Item -ItemType Directory -Force -Path \$dir | Out-Null
          \$base = "https://github.com/${{ github.repository }}/releases/latest/download"
          Invoke-WebRequest -UseBasicParsing -Uri "\$base/${BIN}.exe" -OutFile "\$dir\\${BIN}.exe"
          Write-Host "[${BIN}] Installed -> \$dir\\${BIN}.exe" -ForegroundColor Green
          EOF

          cat > dist/install.sh <<EOF
          #!/usr/bin/env sh
          set -eu
          OS="\$(uname -s)"; ARCH="\$(uname -m)"
          case "\$OS:\$ARCH" in
            Linux:x86_64|Linux:amd64) ASSET="${BIN}-linux-x64" ;;
            Linux:aarch64|Linux:arm64) ASSET="${BIN}-linux-arm64" ;;
            Darwin:arm64|Darwin:aarch64) ASSET="${BIN}-macos-arm64" ;;
            *) echo "Unsupported: \$OS/\$ARCH" >&2; exit 1 ;;
          esac
          mkdir -p "\$HOME/.local/bin"
          curl -fsSL "https://github.com/${{ github.repository }}/releases/latest/download/\$ASSET" -o "\$HOME/.local/bin/${BIN}"
          chmod +x "\$HOME/.local/bin/${BIN}"
          echo "[${BIN}] Installed -> \$HOME/.local/bin/${BIN}"
          EOF
          chmod +x dist/install.sh

          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "${{ inputs.binary_name }} ${TAG} (5-OS Matrix + Installers)" \
              --notes "Automated 5-OS matrix release with install.ps1, install.sh, and SHA256SUMS.txt."
          fi
