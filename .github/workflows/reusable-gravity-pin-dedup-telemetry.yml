name: Reusable Gravity Pinning, Dedup & Runner Telemetry (v11)

on:
  workflow_call:
    inputs:
      bounce_index: { description: 'Current damped-gravity bounce index', required: false, type: string, default: '0' }
      max_bounces: { description: 'Maximum damped-gravity bounces', required: false, type: string, default: '3' }
      damping_factor: { description: 'Gravity damping factor (0.0 - 1.0)', required: false, type: string, default: '0.65' }
      max_shards_per_drop: { description: 'Maximum shards emitted per gravity drop', required: false, type: string, default: '600' }
      target_org: { description: 'Target GitHub organization', required: false, type: string, default: 'awesome-os' }
      auto_bounce: { description: 'Enable automatic bounce chaining when below max_bounces', required: false, type: boolean, default: false }
  workflow_dispatch:
    inputs:
      bounce_index: { description: 'Current damped-gravity bounce index', required: false, type: string, default: '0' }
      max_bounces: { description: 'Maximum damped-gravity bounces', required: false, type: string, default: '3' }
      damping_factor: { description: 'Gravity damping factor (0.0 - 1.0)', required: false, type: string, default: '0.65' }
      max_shards_per_drop: { description: 'Maximum shards emitted per gravity drop', required: false, type: string, default: '600' }
      target_org: { description: 'Target GitHub organization', required: false, type: string, default: 'awesome-os' }
      auto_bounce: { description: 'Enable automatic bounce chaining when below max_bounces', required: false, type: boolean, default: false }

permissions:
  contents: read
  actions: read

jobs:
  gravity-pin-dedup-telemetry:
    name: Gravity Pinning, SHA-512 Dedup & Runner Telemetry (Bounce ${{ inputs.bounce_index || '0' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout holo-ci runtime
        uses: actions/checkout@v7
        with:
          repository: awesome-os/maintenance-workflows
          ref: v1
          path: .holo-ci-runtime

      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Reclaim runner disk headroom & emit gravity telemetry
        id: runner_metrics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOUNCE_INDEX: ${{ inputs.bounce_index || '0' }}
          MAX_BOUNCES: ${{ inputs.max_bounces || '3' }}
          DAMPING_FACTOR: ${{ inputs.damping_factor || '0.65' }}
          MAX_SHARDS_PER_DROP: ${{ inputs.max_shards_per_drop || '600' }}
          TARGET_ORG: ${{ inputs.target_org || 'awesome-os' }}
          AUTO_BOUNCE: ${{ inputs.auto_bounce || false }}
        run: |
          HELPER=".holo-ci-runtime/holo-ci/telemetry-sync-helper.mts"
          if [ -f holo-ci/telemetry-sync-helper.mts ]; then
            HELPER="holo-ci/telemetry-sync-helper.mts"
          fi
          node "${HELPER}" run

      - name: Upload gravity telemetry artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gravity-telemetry-bounce-${{ inputs.bounce_index || '0' }}
          path: |
            gravity-telemetry.json
            gravity-telemetry.ndjson
