name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  holo-ci-self-test:
    name: Holo-CI Test & Self-Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Run holo-ci unit tests
        run: node --test holo-ci/holo-ci.test.mts holo-ci/workflow-scripts.test.mts

      - name: Verify maintenance-workflows via holo-ci
        run: node holo-ci/cli.mts verify --config holo-ci.json --emit-summary --receipt holo-ci-receipt.ndjson

      - name: Upload holo-ci receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: holo-ci-receipt
          path: holo-ci-receipt.ndjson
          retention-days: 7

  sync-v1-tag:
    name: Sync Floating v1 Tag
    needs: [holo-ci-self-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Move v1 floating tag to github.sha
        run: |
          git tag -f v1 "$GITHUB_SHA"
          git push -f origin refs/tags/v1
