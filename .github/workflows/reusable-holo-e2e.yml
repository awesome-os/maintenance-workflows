name: Reusable Holo-E2E Runner (v1)

on:
  workflow_call:
    inputs:
      config-path:
        description: 'Path to holo-ci.json manifest relative to working-directory'
        required: false
        default: 'holo-ci.json'
        type: string
      e2e-command:
        description: 'Optional E2E command executed inside working-directory'
        required: false
        default: ''
        type: string
      working-directory:
        description: 'Working directory inside caller repository'
        required: false
        default: '.'
        type: string
      holo-ci-ref:
        description: 'Git ref of awesome-os/maintenance-workflows to check out'
        required: false
        default: 'v1'
        type: string
      runner-image:
        description: 'Container image for offscreen Lavapipe + Zero-X11 E2E runs'
        required: false
        default: 'ghcr.io/awesome-os/holo-e2e-runner:latest'
        type: string
      runner-tier:
        description: 'OCI E2E runner tier (gpu | lite)'
        required: false
        default: 'gpu'
        type: string
      artifacts-path:
        description: 'Artifacts directory relative to github.workspace'
        required: false
        default: 'holo-e2e-artifacts'
        type: string

permissions:
  contents: read
  packages: read

jobs:
  holo-e2e:
    name: Holo-E2E (Lavapipe Zero-X11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v7

      - name: Checkout holo-ci runtime
        uses: actions/checkout@v7
        with:
          repository: awesome-os/maintenance-workflows
          ref: ${{ inputs.holo-ci-ref }}
          path: .holo-ci-runtime

      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Resolve sovereign holo-e2e-runner image
        id: resolve-image
        shell: bash
        env:
          RUNNER_IMAGE_INPUT: ${{ inputs.runner-image }}
          RUNNER_TIER_INPUT: ${{ inputs.runner-tier }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .holo-ci-runtime/holo-ci/e2e-runner.mts resolve-image

      - name: Run containerized Lavapipe Zero-X11 E2E & holo-ci verify
        shell: bash
        env:
          HOLO_ARTIFACTS_PATH: ${{ inputs.artifacts-path }}
          HOLO_WORKING_DIRECTORY: ${{ inputs.working-directory }}
          HOLO_CONFIG_PATH: ${{ inputs.config-path }}
          E2E_CMD: ${{ inputs.e2e-command }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .holo-ci-runtime/holo-ci/e2e-runner.mts run

      - name: Write Holo-E2E step summary
        if: always()
        shell: bash
        env:
          HOLO_ARTIFACTS_PATH: ${{ inputs.artifacts-path }}
        run: node .holo-ci-runtime/holo-ci/e2e-runner.mts summary

      - name: Upload holo-e2e artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: holo-e2e-artifacts
          path: ${{ inputs.artifacts-path }}
          retention-days: 7
          if-no-files-found: warn
